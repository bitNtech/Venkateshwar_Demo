[pytest]
asyncio_mode = auto

# Only this repo's own tests. Without this, a bare `pytest` at the repo root
# (what README.md tells you to run) walks into the AI4Bharat NeMo fork cloned
# at NeMo_ai4bharat/ and dies collecting ITS test suite, which needs training
# extras this project never installs. The fork is a vendored dependency, not
# code under test here.
testpaths = backend

# Belt and braces for anyone who runs `pytest <path>` explicitly: .venv is
# skipped by default, the NeMo checkout is not.
norecursedirs = NeMo_ai4bharat .venv .git finetune/out
